<!-- =====================================================================
     SECTIONS EN ATTENTE
     =====================================================================
     Tout ce qui suit est prêt mais volontairement éteint, faute de contenu.
     Rien de tout ça ne s'affiche et rien ne se charge tant que c'est éteint.

     POUR RALLUMER UNE SECTION :
       1. supprime la ligne <template ...> juste avant la section
       2. supprime la ligne </template> juste après
       3. remplis le contenu
       4. rajoute son lien dans le menu (voir la navigation plus haut)
     ===================================================================== -->


<!-- ---------- PARCOURS (bio, instruments, expériences, formation) ---------- -->
<template data-section="parcours">
<section class="section" id="parcours">
  <div class="wrap">
    <header class="section__head reveal">
      <p class="section__label">Parcours</p>
      <h2 class="section__title">Le chemin jusqu'ici</h2>
    </header>

    <div class="cv">
      <aside class="cv__side reveal">
        <div class="cv__portrait">
          <img src="assets/img/portrait.svg" alt="Portrait de Mickaël Solomin">
        </div>

        <div class="cv__block">
          <h3>Bio</h3>
          <p><!-- A REMPLIR : 3 à 5 phrases sur ton parcours et ton jeu. --></p>
        </div>

        <div class="cv__block">
          <h3>Instruments</h3>
          <ul class="tags">
            <li>Saxophone</li>
            <!-- Ajoute une ligne <li> par instrument supplémentaire. -->
          </ul>
        </div>

        <div class="cv__block">
          <h3>Compétences</h3>
          <ul class="tags">
            <!-- A REMPLIR : ex. <li>Interprétation</li> <li>Musique de chambre</li> -->
          </ul>
        </div>

        <!-- Mets ton CV en PDF dans assets/ sous le nom cv-solomin.pdf pour activer ce bouton -->
        <a class="btn btn--ghost btn--full" href="assets/cv-solomin.pdf" download>Télécharger le CV (PDF)</a>
      </aside>

      <div class="cv__main">
        <h3 class="cv__heading reveal">Expériences</h3>
        <ol class="timeline">
          <!-- POUR AJOUTER UNE LIGNE : duplique le <li> ci-dessous. -->
          <li class="timeline__item reveal">
            <div class="timeline__date">Année — Année</div>
            <div class="timeline__body">
              <h4>Nom du projet, de l'orchestre ou de la formation</h4>
              <p class="timeline__role">Ton rôle</p>
              <p>Une ou deux phrases de description.</p>
            </div>
          </li>
        </ol>

        <h3 class="cv__heading reveal">Formation</h3>
        <ol class="timeline">
          <li class="timeline__item reveal">
            <div class="timeline__date">Année — Année</div>
            <div class="timeline__body">
              <h4>Établissement</h4>
              <p class="timeline__role">Diplôme obtenu</p>
            </div>
          </li>
        </ol>

        <h3 class="cv__heading reveal">Collaborations &amp; références</h3>
        <ul class="refs reveal">
          <!-- A REMPLIR : une ligne <li> par artiste, salle, orchestre ou festival. -->
        </ul>
      </div>
    </div>
  </div>
</section>
</template>


<!-- ---------- VIDÉOS ---------- -->
<template data-section="videos">
<section class="section section--alt" id="videos">
  <div class="wrap">
    <header class="section__head reveal">
      <p class="section__label">Vidéos</p>
      <h2 class="section__title">Captations &amp; clips</h2>
    </header>

    <!--
      POUR AJOUTER UNE VIDÉO YOUTUBE :
      1. Ouvre la vidéo. Dans l'URL youtube.com/watch?v=XXXXXXXXXXX, l'identifiant est XXXXXXXXXXX
      2. Duplique le bloc <article>, colle l'identifiant dans data-yt et change le titre.
      La miniature s'affiche toute seule. La vidéo ne se charge qu'au clic du visiteur :
      le site reste rapide et YouTube ne dépose aucun cookie avant.
    -->
    <div class="videos" id="videos-grid">
      <article class="video reveal" data-yt="IDENTIFIANT_YOUTUBE">
        <button class="video__play" aria-label="Lire la vidéo : titre de la vidéo"></button>
        <div class="video__meta">
          <h3>Titre de la vidéo</h3>
          <p>Contexte · Année</p>
        </div>
      </article>
    </div>
  </div>
</section>
</template>


<!-- ---------- CONCERTS ---------- -->
<template data-section="concerts">
<section class="section" id="concerts">
  <div class="wrap">
    <header class="section__head reveal">
      <p class="section__label">Concerts</p>
      <h2 class="section__title">Sur scène</h2>
    </header>

    <div class="dates__filters reveal">
      <button class="chip is-active" data-filter="upcoming" aria-pressed="true">À venir</button>
      <button class="chip" data-filter="past" aria-pressed="false">Passés</button>
    </div>

    <!--
      POUR AJOUTER UNE DATE : duplique le <li> ci-dessous.
      data-date DOIT être au format AAAA-MM-JJ.
      Le jour et le mois affichés se remplissent tout seuls : ne les écris pas à la main.
      Le site classe la date dans « À venir » ou « Passés » selon la date du jour,
      et trie l'ensemble. Tu n'auras jamais à réorganiser la liste.
      Sans billetterie, laisse <div class="date__go"></div> vide.
    -->
    <ul class="dates" id="dates-list">
      <li class="date" data-date="2026-01-01">
        <div class="date__when"><span class="date__day"></span><span class="date__month"></span></div>
        <div class="date__what">
          <h3>Nom de la salle</h3>
          <p>Ville, Pays</p>
        </div>
        <div class="date__go"><a class="btn btn--small" href="LIEN_BILLETTERIE" target="_blank" rel="noopener">Billetterie</a></div>
      </li>
    </ul>

    <p class="dates__empty" id="dates-empty" hidden>Aucune date dans cette catégorie pour le moment.</p>
  </div>
</section>
</template>


<!-- ---------- PHOTOS ---------- -->
<template data-section="photos">
<section class="section section--alt" id="photos">
  <div class="wrap">
    <header class="section__head reveal">
      <p class="section__label">Photos</p>
      <h2 class="section__title">Galerie</h2>
    </header>

    <!--
      POUR AJOUTER UNE PHOTO : dépose l'image dans assets/img/, duplique le bouton,
      change le src ET le texte alt (c'est ce que lisent Google et les lecteurs d'écran).
    -->
    <div class="gallery" id="gallery">
      <button class="gallery__item reveal" type="button"><img src="assets/img/photo-1.svg" alt="Description de la photo"></button>
    </div>
  </div>
</section>
</template>


<!-- ===================== CONTACT ===================== -->
<section class="section" id="contact">
  <div class="wrap">
    <header class="section__head section__head--center reveal">
      <p class="section__label">Contact</p>
      <h2 class="section__title">Me contacter</h2>
    </header>

    <div class="contact contact--simple">
      <div class="contact__info reveal">
        <h3>Booking &amp; production</h3>
        <p><a href="mailto:mickasolo.sax@gmail.com">mickasolo.sax@gmail.com</a></p>

        <!--
          Pour afficher un téléphone, enlève les deux lignes de commentaire autour :
          <p><a href="tel:+33600000000">+33 6 00 00 00 00</a></p>
        -->

        <!--
          Pour afficher tes réseaux, colle ce bloc juste en dessous et mets tes liens :
          <h3>Réseaux</h3>
          <ul class="socials">
            <li><a href="LIEN" target="_blank" rel="noopener">Instagram</a></li>
            <li><a href="LIEN" target="_blank" rel="noopener">YouTube</a></li>
            <li><a href="LIEN" target="_blank" rel="noopener">Spotify</a></li>
          </ul>
        -->
      </div>

      <!--
        FORMULAIRE : par défaut il ouvre le logiciel de messagerie du visiteur.
        Ça marche partout, mais tous les visiteurs n'ont pas de logiciel mail configuré.
        Pour recevoir les messages directement dans ta boîte Gmail, crée un compte gratuit
        sur formspree.io, puis remplace les attributs ci-dessous par :
            action="https://formspree.io/f/TON_ID" method="POST"
        et supprime data-mailto et enctype. Le reste se règle tout seul.
      -->
      <form class="contact__form reveal" id="contact-form"
            data-mailto="mickasolo.sax@gmail.com"
            action="mailto:mickasolo.sax@gmail.com" method="post" enctype="text/plain">
        <div class="field">
          <label for="f-name">Nom</label>
          <input id="f-name" name="nom" type="text" required autocomplete="name">
        </div>
        <div class="field">
          <label for="f-email">E-mail</label>
          <input id="f-email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="f-subject">Sujet</label>
          <input id="f-subject" name="sujet" type="text" required>
        </div>
        <div class="field">
          <label for="f-msg">Message</label>
          <textarea id="f-msg" name="message" rows="6" required></textarea>
        </div>
        <button class="btn btn--primary btn--full" type="submit">Envoyer</button>
        <p class="form__note" id="form-note" role="status"></p>
      </form>
    </div>
  </div>
</section>

</main>
